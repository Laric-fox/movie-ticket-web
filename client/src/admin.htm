<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Quản lý Phim | CineFox</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Styles -->
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/admin.css" />
</head>
<body>
  <div class="admin-wrapper d-flex">
    <aside class="sidebar">
      <div class="logo text-center py-4">
        <a href="../index.html" class="text-decoration-none">
          <img src="./img/web.img/logowithname.png" alt="CineFox" class="logo-img">
        </a>
      </div>
      <ul class="nav flex-column px-2">
        <li class="nav-item"><a class="nav-link active" href="./movies.html"><i class="fa-solid fa-film me-2"></i>Quản lý phim</a></li>
        <li class="nav-item"><a class="nav-link" href="./showtimes.html"><i class="fa-solid fa-clock me-2"></i>Suất chiếu</a></li>
        <li class="nav-item"><a class="nav-link" href="./admin-user.htm"><i class="fa-solid fa-users me-2"></i>Người dùng</a></li>
        <li class="nav-item"><a class="nav-link" href="./comments.html"><i class="fa-solid fa-comments me-2"></i>Bình luận</a></li>
        <li class="nav-item mt-3"><a class="btn btn-logout w-100" id="btn-logout"><i class="fa-solid fa-right-from-bracket me-2"></i>Đăng xuất</a></li>
      </ul>
    </aside>

    <main class="main-content flex-fill p-4">
      <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h3 class="mb-0">Quản lý phim</h3>
          <small class="text-muted">CineFox Admin</small>
        </div>

        <div class="row g-4">
          <!-- Form thêm / sửa phim -->
          <div class="col-lg-4">
            <div class="card card-panel">
              <div class="card-body">
                <h5 id="form-title">Thêm phim mới</h5>
                <form id="movie-form" autocomplete="off" enctype="multipart/form-data">
                  <input type="hidden" id="movie-id" />

                  <div class="mb-2">
                    <label class="form-label">Tên phim (name)</label>
                    <input id="name" class="form-control" required />
                  </div>

                  <div class="mb-2">
                    <label class="form-label">Thể loại (category)</label>
                    <input id="category" class="form-control" placeholder="Hành động, Hài,..." />
                  </div>

                  <div class="row gx-2">
                    <div class="col-6 mb-2">
                      <label class="form-label">Thời lượng (phút)</label>
                      <input id="duration" type="number" min="0" class="form-control" />
                    </div>
                    <div class="col-6 mb-2">
                      <label class="form-label">Ngôn ngữ (language)</label>
                      <input id="language" class="form-control" placeholder="Tiếng Việt / English" />
                    </div>
                  </div>

                  <div class="mb-2">
                    <label class="form-label">Trạng thái chiếu (showing_typ)</label>
                    <select id="showing_typ" class="form-select">
                      <option value="now_showing">now_showing</option>
                      <option value="coming_soon">coming_soon</option>
                    </select>
                  </div>

                  <div class="mb-2">
                    <label class="form-label">Ngày chiếu (time)</label>
                    <input id="time" type="date" class="form-control" />
                  </div>

                  <div class="mb-2">
                    <label class="form-label">Trailer file (upload) — sẽ lưu field `trailer`</label>
                    <input id="trailer" type="file" accept="video/*" class="form-control" />
                    <div id="trailer-preview" class="mt-2"></div>
                  </div>

                  <div class="mb-2">
                    <label class="form-label">Mô tả (content)</label>
                    <textarea id="content" rows="3" class="form-control"></textarea>
                  </div>

                  <div class="mb-2">
                    <label class="form-label">Poster (image)</label>
                    <input id="poster" type="file" accept="image/*" class="form-control" />
                    <div id="poster-preview" class="mt-2"></div>
                  </div>

                  <div class="mb-2">
                    <label class="form-label">Đạo diễn (director)</label>
                    <input id="director" class="form-control" />
                  </div>

                  <div class="mb-2">
                    <label class="form-label">Rated (ví dụ: K)</label>
                    <input id="rated" class="form-control" />
                  </div>

                  <div class="d-flex gap-2">
                    <button id="btn-save" type="submit" class="btn btn-primary w-100">Lưu</button>
                    <button id="btn-reset" type="button" class="btn btn-secondary w-100">Đặt lại</button>
                  </div>
                </form>
              </div>
            </div>
          </div>

          <!-- Bảng danh sách phim -->
          <div class="col-lg-8">
            <div class="card card-panel">
              <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <h5 class="mb-0">Danh sách phim</h5>
                  <div class="input-group w-50">
                    <input id="search" class="form-control" placeholder="Tìm tên phim..." />
                    <button id="btn-search" class="btn btn-outline-light"><i class="fa-solid fa-magnifying-glass"></i></button>
                  </div>
                </div>

                <div class="table-responsive">
                  <table class="table table-dark table-striped align-middle text-center">
                    <thead>
                      <tr>
                        <th>#</th>
                        <th>Poster</th>
                        <th>Tên phim</th>
                        <th>Thể loại</th>
                        <th>Ngày chiếu</th>
                        <th>Loại chiếu</th>
                        <th>Hành động</th>
                        <th>...</th>
                      </tr>
                    </thead>
                    <tbody id="movies-list">
                      <!-- Render bằng JS -->
                    </tbody>
                  </table>
                </div>

                <nav>
                  <ul id="pagination" class="pagination justify-content-center mt-3"></ul>
                </nav>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Firebase + App script -->
  <script type="module" src="./js/firebase-config.js"></script>
  <script type="module" src="./js/check-session.js"></script>
  <script type="module" src="./js/admin.js"></script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
