<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Quản lý Người dùng | CineFox</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Styles -->
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/admin.css" />
</head>
<body>
  <div class="admin-wrapper d-flex">
    <aside class="sidebar">
      <div class="logo text-center py-4">
        <a href="../index.html" class="text-decoration-none">
          <img src="./img/web.img/logowithname.png" alt="CineFox" class="logo-img">
        </a>
      </div>
      <ul class="nav flex-column px-2">
        <li class="nav-item"><a class="nav-link" href="./admin.htm"><i class="fa-solid fa-film me-2"></i>Quản lý phim</a></li>
        <li class="nav-item"><a class="nav-link" href="./showtimes.html"><i class="fa-solid fa-clock me-2"></i>Suất chiếu</a></li>
        <li class="nav-item"><a class="nav-link active" href="./admin-user.htm"><i class="fa-solid fa-users me-2"></i>Người dùng</a></li>
        <li class="nav-item"><a class="nav-link" href="./comments.html"><i class="fa-solid fa-comments me-2"></i>Bình luận</a></li>
        <li class="nav-item mt-3"><a class="btn btn-logout w-100" id="btn-logout"><i class="fa-solid fa-right-from-bracket me-2"></i>Đăng xuất</a></li>
      </ul>
    </aside>

    <main class="main-content flex-fill p-4">
      <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h3 class="mb-0">Quản lý người dùng</h3>
          <small class="text-muted">CineFox Admin</small>
        </div>

        <div class="card card-panel">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="mb-0">Danh sách người dùng</h5>
              <div class="input-group w-50">
                <input id="search-user" class="form-control" placeholder="Tìm email hoặc tên..." />
                <button id="btn-search-user" class="btn btn-outline-light"><i class="fa-solid fa-magnifying-glass"></i></button>
              </div>
            </div>

            <div class="table-responsive">
              <table class="table table-dark table-striped align-middle text-center">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Email</th>
                    <th>Tên</th>
                    <th>Số dư</th>
                    
                    <th>Hành động</th>
                  </tr>
                </thead>
                <tbody id="users-list">
                  <!-- Render bằng JS -->
                </tbody>
              </table>
            </div>

            <nav>
              <ul id="pagination-user" class="pagination justify-content-center mt-3"></ul>
            </nav>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Firebase + Script -->
  <script type="module" src="./js/firebase-config.js"></script>
  <script type="module" src="./js/check-session.js"></script>
  <script type="module" src="./js/users.js"></script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
