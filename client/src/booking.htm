<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Đặt vé — CineFox</title>

  <!-- main.css của bạn (có :root màu + navbar styles) -->
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/navbar.css">
  <!-- booking.css mới -->
  <link rel="stylesheet" href="./css/booking.css">
</head>
<body>
    
  <!-- Navbar của bạn (giữ nguyên cách load) -->
  <div id="navbar"></div>
  <br>

  <!-- Booking App -->
  <div id="app" class="booking-wrap">
    

    <main class="booking-main">
      <header class="booking-head">
      <div class="brand">
        <div>
          <br><br><br>
        </div>
      </div>
      <nav class="steps">
        <div class="step" data-step="1">1. Phim</div>
        <div class="step" data-step="2">2. Suất</div>
        <div class="step" data-step="3">3. Ghế</div>
        <div class="step" data-step="4">4. Thanh toán</div>
      </nav>
    </header>
      <!-- STEP 1 -->
      <section id="step-1" class="panel active">
        <h2>Chọn phim</h2>
        <div id="posterGrid" class="poster-grid">Đang tải phim...</div>
        <div class="actions">
          <button id="toStep2" class="btn primary" disabled>Tiếp tục</button>
        </div>
      </section>

      <!-- STEP 2 -->
      <section id="step-2" class="panel">
        <h2>Chọn suất chiếu</h2>
        <div class="showtime-card">
          <div class="movie-preview" id="movieInfo"></div>
          <div class="showtime-controls">
            <div class="field">
              <label>Rạp</label>
              <select id="cinemaSel"></select>
            </div>
            <div class="field">
              <label>Ngày</label>
              <div id="dateChips" class="chip-row"></div>
            </div>
            <div class="field">
              <label>Giờ</label>
              <div id="timeChips" class="chip-row"></div>
            </div>
            <div class="field full">
              <button id="useManualShowtime" class="btn solid">Chọn suất này</button>
            </div>
          </div>
        </div>
        <div class="actions">
          <button id="backTo1" class="btn outline">Quay lại</button>
          <button id="toStep3" class="btn primary" disabled>Tiếp — Chọn ghế</button>
        </div>
      </section>

      <!-- STEP 3 -->
      <section id="step-3" class="panel">
        <h2>Chọn ghế</h2>
        <div class="seat-card">
          <div class="screen">MÀN HÌNH</div>
          <div id="seatArea" class="seat-area"></div>
          <div class="legend">
            <span><i class="box empty"></i> Trống</span>
            <span><i class="box selected"></i> Đang chọn</span>
            <span><i class="box sold"></i> Đã bán</span>
          </div>
        </div>
        <div class="actions">
          <button id="backTo2" class="btn outline">Quay lại</button>
          <button id="toStep4" class="btn primary" disabled>Tiếp — Xác nhận</button>
        </div>
      </section>

      <!-- STEP 4 -->
      <section id="step-4" class="panel">
        <h2>Xác nhận & Thanh toán</h2>
        <div class="summary-grid">
          <div class="panel-box" id="orderCard"></div>
          <div class="panel-box">
            <div class="field"><label>Họ tên</label><input id="buyerName" placeholder="Họ tên"></div>
            <div class="field"><label>Email</label><input id="buyerEmail" placeholder="Email"></div>
            <div class="field">
              <label>Phương thức</label>
              <select id="payMethod">
                <option>Thanh toán trực tiếp tại quầy</option>
                <option>Fake-pay (demo)</option>
              </select>
            </div>
            <div class="actions right">
              <button id="backTo3" class="btn outline">Quay lại</button>
              <button id="confirmPay" class="btn primary">Xác nhận & Thanh toán</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Footer placeholder nếu có -->
  <div id="footer-placeholder"></div>

  <script type="module" src="./js/navbar.js"></script>
  <script type="module" src="./js/booking.js"></script>
</body>
</html>
