<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thông tin tài khoản | CineFox</title>
  <link rel="shortcut icon" href="./img/web.img/logowithname.png" type="image/x-icon" />
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/profile.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="profile-container">
  <h2>Thông tin tài khoản</h2>

  <div class="profile-field">
    <label>Email:</label>
    <input type="text" id="email" readonly>
  </div>

  <div class="profile-field">
    <label>Tên người dùng:</label>
    <input type="text" id="username">
  </div>

  <div class="profile-field">
    <label>Mật khẩu:</label>
    <input type="password" id="password" readonly>
    <button id="btnChangePwd">Đổi mật khẩu</button>
  </div>

  <div class="profile-field balance">
    <label>Số dư (VND):</label>
    <p id="balance">2000000</p>
  </div>

  <div class="profile-field">
    <label>Vai trò:</label>
    <input type="text" id="role_id" readonly>
  </div>

  <button id="btnSaveChanges">💾 Lưu thay đổi</button>
</div>


  <script type="module" src="./js/profile.js"></script>
  <script type="module" src="./js/navbar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
